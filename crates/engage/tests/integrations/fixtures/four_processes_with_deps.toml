ready-when = "exited"

[processes.b]
command = ["echo", "hello world"]
ready-when = "exited"
after = ["a"]

[processes.c]
command = ["echo", "hello world"]
ready-when = "exited"
before = ["d"]

[processes.d]
command = ["echo", "hello world"]
ready-when = "exited"
