[workspace.lints.rust]
missing_abi = "warn"
missing_docs = "warn"
noop_method_call = "warn"
pointer_structural_match = "warn"
unreachable_pub = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
unused_tuple_struct_fields = "warn"

[workspace.lints.clippy]
pedantic = "warn"
as_conversions = "warn"
dbg_macro = "warn"
empty_structs_with_brackets = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
missing_docs_in_private_items = "warn"
negative_feature_names = "warn"
pub_without_shorthand = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_feature_names = "warn"
redundant_type_annotations = "warn"
ref_patterns = "warn"
rest_pat_in_fully_bound_structs = "warn"
str_to_string = "warn"
string_add = "warn"
string_slice = "warn"
string_to_string = "warn"
tests_outside_test_module = "warn"
undocumented_unsafe_blocks = "warn"
unneeded_field_pattern = "warn"
unseparated_literal_suffix = "warn"
unwrap_used = "warn"
wildcard_dependencies = "warn"

[workspace]
members = [
    ".",
    "xtask"
]

[package]
name = "engage"
description = "A task runner with DAG-based parallelism"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://or.computer.surgery/charles/engage"
repository = "https://or.computer.surgery/charles/engage"
readme = "README.md"
categories = [
    "command-line-utilities",
    "development-tools",
    "development-tools::testing",
]
keywords = [
    "ci",
    "command-line",
    "parallel",
    "runner",
    "task",
]
authors = [
    "Charles Hall <charles@computer.surgery>",
]

[lints]
workspace = true

[dependencies]
clap = { version = "4.4.10", features = ["derive"] }
clap_complete = "4.4.4"
crossterm = "0.27.0"
petgraph = "0.6.4"
serde = { version = "1.0.193", features = ["derive"] }
thiserror = "1.0.50"
tokio = { version = "1.34.0", features = ["full"] }
toml = "0.8.8"

[dev-dependencies]
assert_cmd = { version = "2.0.12", features = ["color-auto"] }
insta = "1.34.0"
path_macro = "1.0.0"
predicates = "3.0.4"
strip-ansi-escapes = "0.2.0"
tempfile = "3.8.1"

[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3
