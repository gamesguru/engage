[workspace]
members = [
    ".",
    "print-readme"
]

[package]
name = "engage"
description = "A task runner with DAG-based parallelism"
version = "0.1.0-alpha.2"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://or.computer.surgery/charles/engage"
repository = "https://or.computer.surgery/charles/engage"
readme = "README.md"
categories = [
    "command-line-utilities",
    "development-tools",
    "development-tools::testing",
]
keywords = [
    "ci",
    "command-line",
    "parallel",
    "runner",
    "task",
]
authors = [
    "Charles Hall <charles@computer.surgery>",
]

[dependencies]
clap = { version = "4.0.11", features = ["derive"] }
crossterm = "0.25.0"
petgraph = "0.6.2"
serde = { version = "1.0.145", features = ["derive"] }
thiserror = "1.0.37"
tokio = { version = "1.21.2", features = ["full"] }
toml = "0.5.9"

[dev-dependencies]
assert_cmd = { version = "2.0.4", features = ["color-auto"] }
insta = "1.21.0"
path_macro = "1.0.0"
predicates = "2.1.1"
tempfile = "3.3.0"

[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3
