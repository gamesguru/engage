[processes.reuse]
command = ["reuse", "lint"]

[processes.markdownlint]
command = [
    "bash", "-euo", "pipefail", "-c",

    """
    git ls-files --cached --others --exclude-standard '*.md' \
        | xargs markdownlint
    """
]

[processes.cargo-fmt]
command = ["cargo", "fmt", "--check", "--", "--color", "always"]

[processes.graph]
command = [
    "bash", "-euo", "pipefail", "-c",

    """
    TMPFILE=$(mktemp)
    cargo run --color=always -- -f book/assets/tutorial.toml dot | dot -T svg \
        > $TMPFILE
    diff --color=always -u book/assets/tutorial.svg $TMPFILE
    """
]

[processes.xtask-rustdoc]
command = ["cargo", "xtask", "rustdoc"]

[processes.xtask-clippy]
command = ["cargo", "xtask", "clippy"]

[processes.xtask-test]
command = ["cargo", "xtask", "test"]
