interpreter = ["bash", "-euo", "pipefail", "-c"]

[[task]]
name = "reuse"
group = "lints"
script = "reuse lint"

[[task]]
name = "markdownlint"
group = "lints"
script = """
git ls-files --cached --others --exclude-standard '*.md' | xargs markdownlint
"""

[[task]]
name = "cargo-fmt"
group = "lints"
script = "cargo fmt --check"

[[task]]
name = "cargo-doc"
group = "lints"
script = """
command=(
    env
        RUSTDOCFLAGS="-D warnings"
    cargo doc
        --workspace
        --locked
        --no-deps
        --document-private-items
)

"${command[@]}"
"""

[[task]]
name = "cargo-clippy"
group = "lints"
script = """
command=(
    cargo clippy
        --workspace
        --locked
        --all-targets
        --
        -D warnings
)

"${command[@]}"
"""

[[task]]
name = "graphs"
group = "lints"
script = """
for i in $(seq 0 4); do
    TMPFILE=$(mktemp)
    cargo run -- -f book/assets/$i.toml dot | dot -T svg \
        > $TMPFILE
    diff --color -u book/assets/$i.svg $TMPFILE
done
"""

[[task]]
name = "cargo-test"
group = "tests"
script = """
command=(
    cargo llvm-cov
        --workspace
        --locked
        --all-targets
)

"${command[@]}"
"""
