interpreter = ["/usr/bin/env", "sh", "-euo", "pipefail", "-c"]

[[task]]
name = "nix"
group = "versioner"
script = "nix --version"

[[task]]
name = "direnv"
group = "versioner"
script = "direnv --version"

[[task]]
name = "rustc"
group = "versioner"
script = "rustc --version"

[[task]]
name = "cargo"
group = "versioner"
script = "cargo --version"

[[task]]
name = "cargo fmt"
group = "versioner"
script = "cargo fmt --version"

[[task]]
name = "rustdoc"
group = "versioner"
script = "rustdoc --version"

[[task]]
name = "cargo clippy"
group = "versioner"
script = "cargo clippy -- --version"

[[task]]
name = "nixpkgs-fmt"
group = "versioner"
script = "nixpkgs-fmt --version 2> /dev/null"
# This always exits 1 for some reason
ignore = [ 1 ]

[[task]]
name = "markdownlint"
group = "versioner"
script = "markdownlint --version"

[[task]]
name = "markdownlint"
group = "linter"
script = "markdownlint -i target ."

[[task]]
name = "nixpkgs-fmt"
group = "linter"
script = "nixpkgs-fmt --check ."

[[task]]
name = "rustfmt"
group = "linter"
script = "cargo fmt -- --color=always --check"

[[task]]
name = "clippy"
group = "linter"
script = "cargo clippy --color=always -- -D warnings"

[[task]]
name = "cargo test"
group = "tester"
script = "CLICOLOR_FORCE=1 cargo test --color=always --workspace -- --color=always"
