interpreter = ["bash", "-euo", "pipefail", "-c"]

[[task]]
name = "nix"
group = "versions"
script = "nix --version"

[[task]]
name = "direnv"
group = "versions"
script = "direnv --version"

[[task]]
name = "rustc"
group = "versions"
script = "rustc --version"

[[task]]
name = "cargo"
group = "versions"
script = "cargo --version"

[[task]]
name = "cargo-fmt"
group = "versions"
script = "cargo fmt --version"

[[task]]
name = "rustdoc"
group = "versions"
script = "rustdoc --version"

[[task]]
name = "cargo-clippy"
group = "versions"
script = "cargo clippy -- --version"

[[task]]
name = "markdownlint"
group = "versions"
script = "markdownlint --version"

[[task]]
name = "markdownlint"
group = "lints"
script = "markdownlint -i target -i assets/behavior.md ."

[[task]]
name = "cargo-fmt"
group = "lints"
script = "cargo fmt --check -- --color=always"

[[task]]
name = "cargo-doc"
group = "lints"
script = """
RUSTDOCFLAGS="-D warnings" cargo doc \
    --workspace \
    --no-deps \
    --document-private-items \
    --color always
"""

[[task]]
name = "cargo-clippy"
group = "lints"
script = "cargo clippy --workspace --all-targets --color=always -- -D warnings"

[[task]]
name = "graphs"
group = "lints"
script = """
for i in $(seq 0 4); do
    TMPFILE=$(mktemp)
    cargo run --color=always -- -f doc/assets/$i.toml dot | dot -T svg \
        > $TMPFILE
    diff --color=always -u doc/assets/$i.svg $TMPFILE
done
"""

[[task]]
# Assert that the readme is up to date according to the files it's comprised of.
name = "readme"
group = "lints"
script = """
TMPFILE=$(mktemp)
cargo --color=always xtask print-readme > $TMPFILE
diff --color=always -u README.md $TMPFILE
"""

[[task]]
# Assert that the description in `Cargo.toml` is up to date.
name = "Cargo.toml"
group = "lints"
script = """
COUNT=$(
    grep -F "description = \\"$(cat assets/tagline.txt)\\"" Cargo.toml --count \
    || true
)

if [ $COUNT -eq 0 ]; then
    echo description is out of date
    exit 1
else
    echo all good
fi
"""

[[task]]
name = "cargo"
group = "tests"
script = """
cargo llvm-cov \
    --workspace \
    --all-targets \
    --color=always \
    -- \
    --color=always
"""
