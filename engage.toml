interpreter = ["bash", "-euo", "pipefail", "-c"]

[[task]]
name = "reuse"
script = "reuse lint"

[[task]]
name = "markdownlint"
script = """
git ls-files --cached --others --exclude-standard '*.md' | xargs markdownlint
"""

[[task]]
name = "cargo-fmt"
script = "cargo fmt --check -- --color always"

[[task]]
name = "cargo-doc"
script = """
command=(
    env
        RUSTDOCFLAGS="-D warnings"
    cargo doc
        --workspace
        --locked
        --no-deps
        --document-private-items
        --color always
)

"${command[@]}"
"""

[[task]]
name = "cargo-clippy"
script = """
command=(
    cargo clippy
        --workspace
        --locked
        --all-targets
        --color always
        --
        -D warnings
)

"${command[@]}"
"""

[[task]]
name = "graph"
script = """
TMPFILE=$(mktemp)
cargo run --color=always -- -f book/assets/tutorial.toml dot | dot -T svg \
    > $TMPFILE
diff --color=always -u book/assets/tutorial.svg $TMPFILE
"""

[[task]]
name = "cargo-test"
script = """
command=(
    cargo llvm-cov
        --workspace
        --locked
        --all-targets
        --color always
        --
        --color always
)

"${command[@]}"
"""
