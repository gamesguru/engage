[tasks.reuse]
command = ["reuse", "lint"]

[tasks.markdownlint]
command = [
    "bash", "-euo", "pipefail", "-c",

    """
    git ls-files --cached --others --exclude-standard '*.md' \
        | xargs markdownlint
    """
]

[tasks.cargo-fmt]
command = ["cargo", "fmt", "--check", "--", "--color", "always"]

[tasks.cargo-doc]
env.RUSTDOCFLAGS = "-D warnings"
command = [
    "cargo", "doc",
    "--workspace",
    "--locked",
    "--no-deps",
    "--document-private-items",
    "--color", "always",
]

[tasks.cargo-clippy]
command = [
    "cargo", "clippy",
    "--workspace",
    "--locked",
    "--all-targets",
    "--color", "always",
    "--",
    "-D", "warnings",
]

[tasks.graph]
command = [
    "bash", "-euo", "pipefail", "-c",

    """
    TMPFILE=$(mktemp)
    cargo run --color=always -- -f book/assets/tutorial.toml dot | dot -T svg \
        > $TMPFILE
    diff --color=always -u book/assets/tutorial.svg $TMPFILE
    """
]

[tasks.cargo-test]
command = [
    "cargo", "llvm-cov",
    "--workspace",
    "--locked",
    "--all-targets",
    "--color", "always",
    "--",
    "--color", "always",
]
