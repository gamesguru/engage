interpreter = ["bash", "-euo", "pipefail", "-c"]

[tasks.create-foo]
script = "touch foo"

[tasks.create-bar]
script = "touch bar"

[tasks.delete-foo]
script = "rm foo"
after = ["create-foo"]

[tasks.delete-bar]
script = "rm bar"
after = ["create-bar"]

[tasks.stat-both]
script = "stat foo bar"
after = ["create-foo", "create-bar"]
before = ["delete-foo", "delete-bar"]
