interpreter = ["bash", "-euo", "pipefail", "-c"]

[tasks.create-foo]
script = "touch foo"

[tasks.create-bar]
script = "touch bar"

[tasks.stat-both]
script = "stat foo bar"
after = ["create-foo", "create-bar"]

[tasks.delete-foo]
script = "rm foo"
after = ["create-foo", "stat-both"]

[tasks.delete-bar]
script = "rm bar"
after = ["create-bar", "stat-both"]
