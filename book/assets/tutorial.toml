[tasks.create-foo]
command = ["touch", "foo"]

[tasks.create-bar]
command = ["touch", "bar"]

[tasks.delete-foo]
command = ["rm", "foo"]
after = ["create-foo"]

[tasks.delete-bar]
command = ["rm", "bar"]
after = ["create-bar"]

[tasks.stat-both]
command = ["stat", "foo", "bar"]
after = ["create-foo", "create-bar"]
before = ["delete-foo", "delete-bar"]
