stages:
  - ci
  - deploy

variables:
  # Needed for some programs to print colors.
  TERM: ansi

before_script:
  # Enable the necessary experimental features.
  - echo "experimental-features = nix-command" >> /etc/nix/nix.conf

  # Install direnv.
  - nix profile install -f nix input.nixpkgs.direnv

  # Allow our `.envrc`.
  - direnv allow

  # Set `CARGO_HOME` to a cacheable path.
  - export CARGO_HOME="$(git rev-parse --show-toplevel)/.gitlab-ci.d/cargo"

ci:
  stage: ci
  image: git.lix.systems/lix-project/lix:2.92.3
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - direnv exec . cargo run
  cache:
    paths:
      - target
      - .gitlab-ci.d

pages:
  stage: deploy
  image: git.lix.systems/lix-project/lix:2.92.3
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - direnv exec . mdbook build
  artifacts:
    paths:
      - public
