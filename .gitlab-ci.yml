image: cobaltcause/nix-flakes:2.10.3

stages:
  - ci

variables:
  TERM: "ansi"

before_script:
  # Add CI binary cache
  - mkdir -p .ci-cache/nix
  - echo "extra-substituters = file://$(realpath .ci-cache/nix)" >> /etc/nix/nix.conf
  - echo "extra-trusted-public-keys = ci-0:D3z89ZGF70MddwGxnjPoYVjSQN31Ddh39mmGgDQUgEw=" >> /etc/nix/nix.conf

  # Add computer surgery binary cache
  - "echo 'extra-substituters = https://nix.computer.surgery' >> /etc/nix/nix.conf"
  - "echo 'extra-trusted-public-keys = nix.computer.surgery-0:u7+795vebd4P6yJsU7IDfQYjmERNvvvLd85RPVfBj4I=' >> /etc/nix/nix.conf"

  # Start ssh agent
  - "eval $(ssh-agent -s)"

  # Add private key to ssh agent
  - "echo $NIX_SERVE_SSH_PRIVATE_KEY_BASE64 | base64 -d | ssh-add -"

  # Add computer surgery binary cache public key
  - "mkdir -p ~/.ssh"
  - "chmod 0700 ~/.ssh"
  - "echo 'nix.computer.surgery ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINOnmP7sm6cfe2f5Jr9RJMjSoteggSIhV076udXFXKjA' > ~/.ssh/known_hosts"

  # Set CARGO_HOME to a fixed path
  - "export CARGO_HOME=\"$(git rev-parse --show-toplevel)/.ci-cache/cargo\""

  # Allow .envrc
  - "direnv allow"

ci:
  stage: ci
  cache:
    paths:
      - target
      - .ci-cache
  script:
    - "direnv exec . cargo run"
    - "nix copy --to ssh://nix-ssh@nix.computer.surgery .#default"

    # Copy the whole Nix Store to a cache to speed up the next build
    - NIX_CI_CACHE_PRIVATE_KEY_FILE=$(mktemp)
    - echo $NIX_CI_CACHE_PRIVATE_KEY_BASE64 | base64 -d > $NIX_CI_CACHE_PRIVATE_KEY_FILE
    - nix copy --to "file://$(realpath .ci-cache/nix)?compression=none&secret-key=$NIX_CI_CACHE_PRIVATE_KEY_FILE" --all
    - rm $NIX_CI_CACHE_PRIVATE_KEY_FILE
